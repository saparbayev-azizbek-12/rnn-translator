{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN Translator</title>
    <link rel="stylesheet" href="{% static 'translator/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                RNN Translator
            </div>
        </div>
        <div class="nav-right">
            <div class="model-info">
                Model: <select class="model-select"><option>French → English</option></select>
            </div>
        </div>
    </nav>
    <main class="main-container">
        <div class="translator-box">
            <div class="panel left-panel">
                <div class="panel-header">French</div>
                <div class="textarea-wrapper">
                    {% csrf_token %}
                    <textarea id="source-text" placeholder="Type here..."></textarea>
                </div>
                <div class="panel-footer">
                    <button class="action-btn" id="clear-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    <div class="char-count" id="char-count">0/5000</div>
                </div>
            </div>
            <div class="panel right-panel">
                <div class="panel-header">English</div>
                <div class="textarea-wrapper">
                    <textarea id="target-text" readonly></textarea>
                </div>
                <div class="panel-footer">
                    <button class="action-btn" id="copy-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                    <div id="loader" class="loader"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="{% static 'translator/script.js' %}"></script>
</body>
</html>
