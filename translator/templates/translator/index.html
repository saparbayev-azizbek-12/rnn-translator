{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN Translator</title>
    <link rel="icon" type="image/png" href="../../static/images/translate.svg">
    <link rel="stylesheet" href="{% static 'translator/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="gt-header">
        <div class="header-left">
            <div class="logo">
                <img src="../../static/images/translate.svg" alt="Google" style="width: 74px; height: 24px; vertical-align: middle;">
                <span class="logo-text"><span class="rnn-text">RNN</span> Translator</span>
            </div>
        </div>
        <div class="header-right">
             <div class="active-model-container">
                <span class="model-badge">RNN Engine:</span>
                <select id="model-selector" class="model-select">
                    <option value="fra-eng">FRA-ENG</option>
                    <option value="eng-fra">ENG-FRA</option>
                    <option value="eng-rus">ENG-RUS</option>
                </select>
             </div>
        </div>
    </header>

    <main class="gt-main">
        <div class="gt-content-wrapper">
            <!-- Language Bar -->
            <div class="gt-lang-bar">
                <div class="lang-selection source-langs" id="src-tabs">
                    <div class="tabs-desktop">
                        <button class="lang-tab" data-lang="eng">English</button>
                        <button class="lang-tab" data-lang="rus">Russian</button>
                        <button class="lang-tab" data-lang="fra">French</button>
                        <div class="tab-indicator" id="src-indicator"></div>
                    </div>
                    <button class="compact-lang-selector" id="src-compact-btn">
                        <span class="current-lang-name">English</span>
                        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                    </button>
                </div>

                <div class="swap-container">
                    <button class="gt-swap-btn" id="swap-btn" title="Swap languages">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"></path></svg>
                    </button>
                </div>

                <div class="lang-selection target-langs" id="tgt-tabs">
                    <div class="tabs-desktop">
                        <button class="lang-tab" data-lang="eng">English</button>
                        <button class="lang-tab" data-lang="rus">Russian</button>
                        <button class="lang-tab" data-lang="fra">French</button>
                        <div class="tab-indicator" id="tgt-indicator"></div>
                    </div>
                    <button class="compact-lang-selector" id="tgt-compact-btn">
                        <span class="current-lang-name">Russian</span>
                        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Translation Area -->
            <div class="gt-boxes">
                <div class="gt-box source-box">
                    {% csrf_token %}
                    <textarea id="source-text" placeholder="Text to translate"></textarea>
                    <div class="box-footer">
                        <div class="footer-left">
                            <button class="icon-btn" id="clear-btn" title="Clear text">
                                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                        </div>
                        <div class="footer-right">
                             <div class="char-count" id="char-count">0/5000</div>
                        </div>
                    </div>
                </div>

                <div class="gt-box target-box">
                    <div id="loader" class="loader"></div>
                    <textarea id="target-text" readonly placeholder="Translation"></textarea>
                    <div class="box-footer">
                        <div class="footer-left">
                            <button class="icon-btn" id="copy-btn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
                        </div>
                        <div class="footer-right">
                             <button id="check-alt-btn" class="alt-trigger-btn">Check Alternative</button>
                        </div>
                    </div>

                    <!-- Alternative result integrated inside target box for a better look -->
                    <div id="alternative-box" class="alt-card">
                         <div class="alt-label">MyMemory Alternative:</div>
                         <div id="alt-text" class="alt-content">...</div>
                    </div>
                </div>
            </div>
        </div>
    <!-- Language Search Overlay -->
    <div id="lang-search-overlay" class="lang-overlay">
        <header class="overlay-header">
            <button id="close-overlay" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <input type="text" id="lang-search-input" placeholder="Search languages..." autocomplete="off">
        </header>
        <div class="overlay-content">
            <div class="lang-section">
                <div class="section-label">Supported Languages</div>
                <div id="all-langs-list" class="lang-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'translator/script.js' %}"></script>
</body>
</html>
